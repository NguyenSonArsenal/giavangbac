version: '3.8'

services:
  # ===== MYSQL service =====
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql-laravel
    restart: unless-stopped
    ports:
      - "3307:3306"       # 3307 tránh đụng XAMPP
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=db_giavangbac
    volumes:
      - mysql_data:/var/lib/mysql   # giữ data khi restart
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - laravel-network

  # ===== PHP-FPM service =====
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: php-laravel
    depends_on:
      mysql:
        condition: service_healthy   # ← chờ MySQL healthy mới start
    restart: unless-stopped
    volumes:
      - .:/var/www/html   # mount source code (để sửa code thấy ngay)
    networks:
      - laravel-network

  # ===== NGINX service =====
  nginx:
    image: nginx:alpine
    container_name: nginx-laravel
    restart: unless-stopped
    ports:
      - "8080:80"        # dùng 8080 tránh đụng XAMPP Apache
    volumes:
      - .:/var/www/html                                    # mount source code
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf  # mount config
    depends_on:
      - php
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
    name: laravel-network

volumes:
  mysql_data:
