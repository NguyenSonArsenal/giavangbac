# config nginx
server {
    # Nginx lắng nghe port 80
    listen 80;

    # Root trỏ vào thư mục public của Laravel
    root /var/www/html/public;

    index index.php index.html;

    # Xử lý tất cả request
    location / {
        # Thử tìm file thật → nếu không có thì chuyển sang index.php
        # Đây là cơ chế routing của Laravel
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Proxy PHP request sang PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass php:9000;          # ← tên service php trong docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bỏ qua file ẩn (.env, .git...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
